name: Update NDX data

# One run is always up: it updates every 5 minutes while the US market is open, waits while it
# is closed, and before the 6-hour limit starts the next run itself (workflow_dispatch, which
# GitHub does not skip). The schedules below are only a backup that restarts the chain if it
# ever breaks; a start while a run is going waits in the queue and takes over after it.
on:
  schedule:
    - cron: "25 13 * * 1-5"   # 9:25 ET in summer time
    - cron: "25 14 * * 1-5"   # 9:25 ET in winter time
    - cron: "47 13 * * 1-5"
    - cron: "47 14 * * 1-5"
    - cron: "17 16 * * 1-5"
    - cron: "17 18 * * 1-5"
    - cron: "43 22 * * 1-5"   # after the close, for the final daily figures
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Update every 5 minutes while the market is open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # open: 9:25-16:15 ET on weekdays; final: just after the close and in the evening,
          # for the closing figures; closed: everything else
          session() {
            python -c 'from datetime import datetime; from zoneinfo import ZoneInfo
          n = datetime.now(ZoneInfo("America/New_York")); m = n.hour * 60 + n.minute
          wk = n.weekday() < 5
          print("open" if wk and 565 <= m < 975 else "final" if wk and (975 <= m < 990 or 1120 <= m < 1135) else "closed")'
          }
          update() {
            timeout 600 python scripts/update_ndx.py || echo "update failed; trying again next time"
            git add data/
            if ! git diff --cached --quiet; then
              git commit -q -m "data: update NDX heatmap"
              timeout 120 git pull -q --rebase origin main || { git rebase --abort 2>/dev/null; timeout 120 git pull -q --no-rebase -X ours origin main; }
              timeout 120 git push -q || echo "push failed; trying again next time"
            fi
          }
          start=$(date +%s)
          update
          while [ $(( $(date +%s) - start )) -lt 20400 ]; do
            case "$(session)" in
              open|final) sleep 300; s=$(session); [ "$s" = closed ] || update ;;
              *) sleep 60 ;;
            esac
          done
          # close to the 6-hour limit: hand over to a fresh run
          gh workflow run update-data.yml --ref main -R "$GITHUB_REPOSITORY" || echo "handover failed; the schedules will restart"
