<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nasdaq 100</title>
<meta name="description" content="ナスダック100の騰落率、寄与度、セクター、ランキング">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nasdaq 100">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1114">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=LINE+Seed+JP:wght@400;700;800&display=swap">
<style>
/* Layout: sticky control bar → summary band → contributors + sector ranking (2 columns on wide screens) → treemap or ranked list */
:root{
  /* always dark, like the TQQQ app */
  --bg:#0f1114; --panel:#171a1f; --ink:#eef0f2; --ink2:#b9bfc8; --muted:#848c97; --line:#2a2f37; --accent:#5ea4ff;
  --up:#2db069; --down:#ea4a51; --upAlt:#4a8df0; --mid:#363b44; --na:#2a2e35; --chip:#22262d; --shade:rgba(0,0,0,.35);
  --f-tick:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"LINE Seed JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.num{font-family:var(--f-tick);font-variant-numeric:tabular-nums;letter-spacing:.01em}
/* Archivo runs semi-condensed wherever tickers and figures sit */
.num,.tile,.crow .tk,.row .tk,.dtk,.stat .val,h1,.pc .n,.sec .sh b,#tip b{font-stretch:82%}
.avatar{width:42px;height:42px;border-radius:10px;flex:none;box-shadow:0 0 0 1px var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
[hidden]{display:none!important}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{margin:0;white-space:nowrap;font-family:var(--f-tick);font-weight:700;font-size:26px;letter-spacing:.02em;line-height:1.1}
h1 small{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--muted);margin-left:8px;letter-spacing:0}
.status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--ink2)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.pill.open i{background:var(--upc)}
.pill.warn{color:var(--downc)}
.refresh{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);width:40px;height:40px;border-radius:50%;font-size:19px;line-height:1;cursor:pointer;flex:none}
.refresh.spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;background:var(--chip);border-radius:8px;padding:3px;gap:2px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{appearance:none;border:0;background:transparent;color:var(--ink2);font:500 13px/1 var(--f-body);padding:8px 11px;border-radius:6px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px var(--shade);font-weight:700}
button:focus-visible,.crow:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:14px}
.stat{background:var(--panel);padding:12px 14px;min-width:0}
.stat .lab{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.stat .val{font-family:var(--f-tick);font-weight:700;font-size:28px;line-height:1.15;font-variant-numeric:tabular-nums}
.stat .sub{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos{color:var(--upc)} .neg{color:var(--downc)}

.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.panel h2{margin:0 0 10px;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--ink2);display:flex;justify-content:space-between;gap:8px}
.panel h2 span{font-weight:400;color:var(--muted);letter-spacing:0}
.contrib{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.contrib h3{margin:0 0 6px;font-size:12px;font-weight:500;color:var(--muted)}
.crow{display:grid;grid-template-columns:52px minmax(0,1fr) 52px;align-items:center;gap:6px;height:28px;cursor:pointer;border-radius:4px}
.crow:hover{background:var(--chip)}
.crow .tk{font-family:var(--f-tick);font-weight:700;font-size:15px}
.crow .track{height:10px;position:relative}
.crow .fill{position:absolute;top:0;bottom:0;left:0;border-radius:0 4px 4px 0}
.crow .v{text-align:right;font-size:14px}

.secrow{appearance:none;border:0;background:transparent;color:inherit;font:inherit;width:100%;display:grid;grid-template-columns:minmax(78px,9em) 46px minmax(0,1fr) 62px;align-items:center;gap:8px;padding:6px;border-radius:6px;cursor:pointer;text-align:left}
.secrow:hover{background:var(--chip)}
.secrow[aria-pressed="true"]{background:var(--chip);box-shadow:inset 3px 0 0 var(--accent)}
.secrow .nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.secrow .wt{font-size:12px;color:var(--muted);text-align:right}
.dbar{position:relative;height:12px}
.dbar::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line)}
.dbar i{position:absolute;top:1px;bottom:1px}
.secrow .v{text-align:right;font-size:15px;font-weight:600}

.mapbox{margin-top:14px}
.cols+.foot{margin-top:18px}
.maphead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.maphead .hint{font-size:12px;color:var(--muted)}
.back{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:500 13px/1 var(--f-body);padding:8px 12px;border-radius:999px;cursor:pointer}
.legend{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.legend .ramp{width:150px;height:10px;border-radius:3px}
#map{position:relative;width:100%;background:var(--bg);border-radius:8px;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.sec{position:absolute;pointer-events:none}
.sec .sh{position:absolute;left:0;right:0;top:0;height:20px;display:flex;align-items:center;gap:6px;padding:0 4px;font-size:11.5px;font-weight:700;color:var(--ink2);white-space:nowrap;overflow:hidden}
.sec .sh b{font-family:var(--f-tick);font-size:13px;font-weight:600;flex:none}
.sec .sh span{min-width:2.3em;overflow:hidden;text-overflow:ellipsis}
.tile{position:absolute;appearance:none;border:0;padding:0;margin:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;font-family:var(--f-tick);line-height:1;transition:filter .12s}
.tile:hover{filter:brightness(1.12)}
.tile.sel{outline:2px solid var(--ink);outline-offset:-2px;z-index:2}
.tile .t{font-weight:700;white-space:nowrap}
.tile .p{font-weight:500;white-space:nowrap;margin-top:.18em;opacity:.95;font-variant-numeric:tabular-nums}

#list{display:flex;flex-direction:column;gap:2px}
.row{appearance:none;border:0;background:var(--panel);color:inherit;font:inherit;text-align:left;display:grid;grid-template-columns:30px 62px minmax(0,1fr) minmax(70px,26%) 70px;align-items:center;gap:8px;padding:9px 10px;border-radius:6px;cursor:pointer}
.row:hover{background:var(--chip)}
.row .rk{font-size:12px;color:var(--muted);text-align:right}
.row .tk{font-family:var(--f-tick);font-weight:700;font-size:17px}
.row .nm{min-width:0}
.row .nm div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.row .nm small{font-size:11px;color:var(--muted)}
.row .v{text-align:right;font-size:17px;font-weight:600}

/* weights view */
.wtop{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.wstats{display:flex;gap:20px;flex-wrap:wrap}
.wstats div{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.wstats b{display:block;font-family:var(--f-tick);font-stretch:82%;font-size:24px;font-weight:700;color:var(--ink);letter-spacing:0;font-variant-numeric:tabular-nums;line-height:1.15}
#wlist{display:flex;flex-direction:column;gap:2px}
.wrow{appearance:none;border:0;background:var(--panel);color:inherit;font:inherit;text-align:left;display:grid;grid-template-columns:26px 58px minmax(0,1fr) 56px 60px;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer}
.wrow:hover{background:var(--chip)}
.wrow .rk{font-size:12px;color:var(--muted);text-align:right}
.wrow .tk{font-family:var(--f-tick);font-stretch:82%;font-weight:700;font-size:16px;line-height:1.1}
.wrow .tk small{display:block;font-family:var(--f-body);font-stretch:100%;font-weight:400;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbar{height:16px;position:relative;background:var(--chip);border-radius:3px;overflow:hidden}
.wbar i{position:absolute;left:0;top:0;bottom:0;border-radius:0 3px 3px 0}
.wrow .w{text-align:right;font-size:16px;font-weight:700}
.wrow .v{text-align:right;font-size:13px}
.wsep{font-size:11px;color:var(--muted);padding:8px 10px 4px;letter-spacing:.04em}
.wnote{font-size:11.5px;color:var(--muted);margin:10px 0 0}
/* rank history view */
.rtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.rtitle{font-size:13px;font-weight:700;color:var(--ink2);letter-spacing:.04em}
.rkey{display:flex;gap:12px;font-size:11.5px;color:var(--muted);flex-wrap:wrap;margin-bottom:4px}
.rkey i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
#rchart{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 4px 2px;touch-action:pan-y}
#rchart svg{display:block;width:100%;height:auto;overflow:visible}
#rchart .ax{font-family:var(--f-tick);font-stretch:82%;font-size:11px;fill:var(--muted)}
#rchart .grid{stroke:var(--line);stroke-width:1}
#rchart .ln{fill:none;stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round;opacity:.75}
#rchart .lb{font-family:var(--f-tick);font-stretch:82%;font-size:11.5px;font-weight:700;fill:var(--ink2);cursor:pointer}
#rchart.has-sel .ln{opacity:.22}
#rchart.has-sel .lb{opacity:.45}
#rchart .ln.on{opacity:1;stroke-width:3.2;stroke:var(--ink)}
#rchart .lb.on{opacity:1;fill:var(--ink)}
#rchart .xh{stroke:var(--ink2);stroke-width:1;stroke-dasharray:3 3}
#rchart .dot{fill:var(--ink);stroke:var(--panel);stroke-width:2}
.rinfo{margin-top:10px}
.rinfo h3{margin:0 0 6px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.rinfo h3 span{font-weight:400;color:var(--muted);margin-left:6px}
.rsel{font-size:13px;margin:0 0 8px;color:var(--ink2)}
.rsel b{font-family:var(--f-tick);font-stretch:82%;font-size:17px;color:var(--ink)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:4px}
.rchip{appearance:none;border:1px solid var(--line);background:var(--panel);color:inherit;font:inherit;display:flex;align-items:baseline;gap:6px;padding:6px 8px;border-radius:6px;cursor:pointer;text-align:left}
.rchip:hover{background:var(--chip)}
.rchip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.rchip .r{font-family:var(--f-tick);font-stretch:82%;font-size:13px;color:var(--muted);min-width:22px;text-align:right}
.rchip .t{font-family:var(--f-tick);font-stretch:82%;font-size:15px;font-weight:700}
.rchip .d{margin-left:auto;font-family:var(--f-tick);font-stretch:82%;font-size:11.5px}
.empty{padding:60px 16px;text-align:center;color:var(--muted);font-size:13px}

#tip{position:fixed;z-index:40;pointer-events:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:0 6px 20px var(--shade);border-radius:8px;padding:8px 10px;font-size:12px;max-width:240px}
#tip b{font-family:var(--f-tick);font-size:17px}
#detail{position:fixed;z-index:50;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -10px 30px var(--shade);border-radius:14px 14px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dtk{font-family:var(--f-tick);font-weight:700;font-size:34px;line-height:1}
.dname{font-size:14px;margin-top:4px}
.dmeta{font-size:12px;color:var(--muted);margin-top:2px}
.x{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:500 13px/1 var(--f-body);padding:9px 13px;border-radius:999px;cursor:pointer}
.dfacts{display:flex;gap:18px;margin-top:10px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.dfacts b{font-family:var(--f-tick);font-size:17px;color:var(--ink);margin-left:4px}
.dfacts small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.csum{font-size:12px;color:var(--muted);margin:-2px 0 8px}
.csum b{font-family:var(--f-tick);font-size:14px;font-stretch:82%}
.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:12px}
@media (min-width:560px) and (max-width:899px){.pgrid{grid-template-columns:repeat(7,minmax(0,1fr))}}
.pc{border-radius:6px;padding:7px 2px;text-align:center}
.pc .l{font-size:10.5px;opacity:.9}
.pc .n{font-family:var(--f-tick);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.pc.cur{outline:2px solid var(--ink);outline-offset:-2px}
.dlink{display:inline-block;margin-top:12px;font-size:13px;color:var(--accent)}
.foot{margin-top:18px;font-size:11.5px;color:var(--muted);line-height:1.7}
.foot a{color:var(--accent,var(--ink2))}
.foot.lab{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}
.labname{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;color:var(--ink);letter-spacing:.06em}
.labname img{width:36px;height:36px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1px var(--line)}

@media (min-width:900px){
  #detail{left:auto;right:max(20px,env(safe-area-inset-right,0px));bottom:max(20px,env(safe-area-inset-bottom,0px));width:360px;border:1px solid var(--line);border-radius:12px;padding:16px}
  .pgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width:760px){
  .summary{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols{grid-template-columns:minmax(0,1fr)}
  h1{font-size:23px}
  .row{grid-template-columns:24px 54px minmax(0,1fr) 64px}
  .row .bc{display:none}
}
@media (max-width:420px){
  .contrib{grid-template-columns:minmax(0,1fr)}
  .stat .val{font-size:25px}
  .seg button{padding:8px 9px;font-size:12.5px}
}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.refresh.spin{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="titlerow">
      <div class="brand">
        <img class="avatar" src="icons/app.png" alt="" width="42" height="42">
        <div style="min-width:0">
          <h1>Nasdaq 100</h1>
          <div class="status" id="status">読み込み中…</div>
        </div>
      </div>
      <button type="button" class="refresh" id="refresh" aria-label="最新データに更新">↻</button>
    </div>
    <div class="controls">
      <div class="seg" id="periods" role="group" aria-label="期間"></div>
      <div class="seg" id="views" role="group" aria-label="表示">
        <button type="button" data-v="map">マップ</button>
        <button type="button" data-v="list">ランキング</button>
        <button type="button" data-v="weight">ウェイト</button>
        <button type="button" data-v="rank">順位推移</button>
      </div>
    </div>
  </div>

  <div id="app" hidden>
    <div class="summary" id="summary"></div>
    <section class="mapbox">
      <div class="maphead">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <button type="button" class="back" id="back" hidden>← 全体に戻る</button>
          <span class="hint" id="hint"></span>
        </div>
        <div class="legend"><span class="num" id="lgL"></span><span class="ramp" id="ramp"></span><span class="num" id="lgR"></span></div>
      </div>
      <div id="map" role="img" aria-label="ナスダック100の銘柄別騰落率ヒートマップ"></div>
      <div id="list" hidden></div>
      <div id="weights" hidden>
        <div class="wtop">
          <div class="wstats" id="wstats"></div>
          <div class="seg" id="wscope" role="group" aria-label="表示する銘柄">
            <button type="button" data-w="20">トップ20</button>
            <button type="button" data-w="all">全銘柄</button>
          </div>
        </div>
        <div id="wlist"></div>
      </div>
      <div id="ranks" hidden>
        <div class="rtop">
          <div class="rtitle">時価総額の順位推移（月末）</div>
          <div class="seg" id="rrange" role="group" aria-label="期間">
            <button type="button" data-rr="10">10年</button>
            <button type="button" data-rr="5">5年</button>
            <button type="button" data-rr="3">3年</button>
          </div>
        </div>
        <div class="rkey" id="rkey"></div>
        <div id="rchart"></div>
        <div class="rinfo" id="rinfo"></div>
      </div>
    </section>
    <div class="cols">
      <section class="panel">
        <h2>指数への寄与 <span>期初ウェイト×騰落率（%pt）</span></h2>
        <div class="csum" id="csum"></div>
        <div class="contrib" id="contrib"></div>
      </section>
      <section class="panel">
        <h2>セクター <span>タップでマップを絞り込み</span></h2>
        <div id="sectors"></div>
      </section>
    </div>
    <div class="foot lab"><span class="labname"><img src="icons/avatar.jpg" alt="" width="36" height="36">恐怖指数研究所</span><a href="https://limelightle-debug.github.io/tqqq/">TQQQ を開く</a></div>
  </div>
  <div class="empty" id="empty">データを読み込んでいます…</div>
</div>

<div id="tip" hidden></div>
<aside id="detail" hidden aria-live="polite"></aside>

<script src="d3.min.js"></script>
<script>
const PERIODS=[["d1","1日"],["w1","1週"],["w4","1ヶ月"],["w13","3ヶ月"],["w26","6ヶ月"],["ytd","年初来"],["w52","1年"]];
const PLABEL=Object.fromEntries(PERIODS);
const CLAMP={d1:3,w1:8,w4:12,w13:20,w26:30,ytd:50,w52:60};
const SEC_JA={"Technology":"テクノロジー","Consumer Defensive":"生活必需品","Consumer Cyclical":"一般消費財","Communication Services":"通信サービス","Healthcare":"ヘルスケア","Industrials":"資本財","Basic Materials":"素材","Financial":"金融","Energy":"エネルギー","Utilities":"公益","Real Estate":"不動産"};
const secJa=s=>SEC_JA[s]||s;

let DATA=null, STOCKS=[], BY={}, CAPTOTAL=0, SECTORS=[], SWC={};
const store={get(k,d){try{const v=localStorage.getItem("ndxhm."+k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem("ndxhm."+k,v)}catch(e){}}};
const state={period:store.get("period","d1"),view:store.get("view","map"),wscope:store.get("wscope","20"),rrange:store.get("rrange","10"),rsel:null,rmonth:null,zoom:null,sel:null};
if(!["map","list","weight","rank"].includes(state.view))state.view="map";
if(!["10","5","3"].includes(state.rrange))state.rrange="10";
let RH=null;
if(!PLABEL[state.period])state.period="d1";

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const val=(t,p=state.period)=>{const v=DATA&&DATA.perf[p]&&DATA.perf[p][t];return typeof v==="number"?v:null};
function fmt(v,d){if(v==null)return"—";const a=Math.abs(v);const dd=d!=null?d:(a>=100?0:a>=10?1:2);return(v>0?"+":v<0?"−":"±")+a.toFixed(dd)+"%"}
function fmtCap(m){return m>=1e6?(m/1e6).toFixed(2)+"兆ドル":Math.round(m/100).toLocaleString()+"億ドル"}

function setData(d){
  DATA=d;
  STOCKS=d.stocks.filter(s=>s&&s.t&&s.cap>0);
  BY=Object.fromEntries(STOCKS.map(s=>[s.t,s]));
  CAPTOTAL=STOCKS.reduce((a,s)=>a+s.cap,0);
  // Index weight in % (s.w): QQQ holdings when available, market-cap share otherwise; normalised to 100.
  const W=d.weights&&d.weights.w;
  STOCKS.forEach(s=>{s.w=(W&&typeof W[s.t]==="number")?W[s.t]:s.cap/CAPTOTAL*100});
  // Weights are as of the previous close; carry them through today's move so they match the prices shown.
  if(W&&d.weights.asOf&&d.weights.asOf<tradeDate(d.updatedAt)){STOCKS.forEach(s=>{const r=d.perf.d1&&d.perf.d1[s.t];if(typeof r==="number")s.w*=1+r/100})}
  const wsum=STOCKS.reduce((a,s)=>a+s.w,0)||1;STOCKS.forEach(s=>{s.w=s.w/wsum*100});
  SWC={};
  const caps={};STOCKS.forEach(s=>{caps[s.sec]=(caps[s.sec]||0)+s.w});
  SECTORS=Object.keys(caps).sort((a,b)=>caps[b]-caps[a]);
  if(state.sel&&!BY[state.sel])state.sel=null;
  if(state.zoom&&!SECTORS.includes(state.zoom))state.zoom=null;
}

/* market status */
// The US trading day the data belongs to (New York date; before the open counts as the previous weekday).
function tradeDate(iso){
  let t=new Date(iso).getTime();
  const fmt=x=>new Intl.DateTimeFormat("en-CA",{timeZone:"America/New_York",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date(x));
  const p=nyParts(new Date(t));
  if(p.min<570)t-=864e5;
  for(let i=0;i<4;i++){const wd=nyParts(new Date(t)).wd;if(wd!=="Sat"&&wd!=="Sun")break;t-=864e5}
  return fmt(t);
}
function nyParts(date){const f=new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",weekday:"short",hour:"numeric",minute:"numeric",hour12:false}).formatToParts(date);const o={};f.forEach(p=>o[p.type]=p.value);return{wd:o.weekday,min:(+o.hour%24)*60+(+o.minute)}}
function marketOpen(date=new Date()){const p=nyParts(date);return !["Sat","Sun"].includes(p.wd)&&p.min>=570&&p.min<960}
function renderStatus(){
  if(!DATA){return}
  const d=new Date(DATA.updatedAt);
  const t=new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",month:"numeric",day:"numeric",weekday:"short",hour:"2-digit",minute:"2-digit"}).format(d);
  const open=marketOpen();
  const ageMin=(Date.now()-d.getTime())/6e4;
  const stale=open?ageMin>45:ageMin>4*1440;
  $("status").innerHTML=`<span>更新 ${esc(t)}</span><span class="pill ${open?"open":""}"><i></i>${open?"米国市場 取引中":"米国市場 時間外"}</span>${stale?`<span class="pill warn">更新が遅れています</span>`:""}`;
}

let C={};
function readColors(){
  const cs=getComputedStyle(document.documentElement);
  const g=n=>cs.getPropertyValue(n).trim();
  C={up:g("--up"),down:g("--down"),mid:g("--mid"),na:g("--na"),flat:g("--muted")};
  document.documentElement.style.setProperty("--upc",C.up);
  document.documentElement.style.setProperty("--downc",C.down);
}
function colorAt(v,p){
  if(v==null)return C.na;
  const t=Math.max(-1,Math.min(1,v/CLAMP[p]));
  return d3.interpolateLab(C.mid,t>=0?C.up:C.down)(Math.pow(Math.abs(t),.75));
}
const color=v=>colorAt(v,state.period);
function inkOn(bg){const c=d3.rgb(bg);const L=x=>{x/=255;return x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4)};const l=.2126*L(c.r)+.7152*L(c.g)+.0722*L(c.b);return l>.36?"#121417":"#ffffff"}
// Weight at the start of period p, backed out from the current weight: w_start ∝ w_now / (1 + return).
// Every return and contribution uses it, so the contributions add up exactly to the index return.
function startW(p=state.period){
  if(SWC[p])return SWC[p];
  const m={};let tot=0;
  STOCKS.forEach(s=>{const v=val(s.t,p);if(v!=null&&v>-100){m[s.t]=s.w/(1+v/100);tot+=m[s.t]}});
  Object.keys(m).forEach(t=>m[t]=m[t]/(tot||1)*100);
  return SWC[p]=m;
}
const contrib=(t,p=state.period)=>{const w=startW(p)[t],v=val(t,p);return w==null||v==null?null:w/100*v};
function wret(list,p=state.period){const m=startW(p);let s=0,w=0;list.forEach(x=>{const v=val(x.t,p);if(v!=null&&m[x.t]!=null){s+=m[x.t]*v;w+=m[x.t]}});return w?s/w:null}
function weightNote(){const w=DATA&&DATA.weights;if(!w||!w.asOf)return"時価総額ベースの概算";const [y,m,dd]=w.asOf.split("-");return`QQQの保有比率（${+m}/${+dd}時点）`}
const cls=v=>v>0?"pos":v<0?"neg":"";

function renderControls(){
  $("periods").innerHTML=PERIODS.map(([k,l])=>`<button type="button" data-p="${k}" aria-pressed="${k===state.period}">${l}</button>`).join("");
  document.querySelectorAll("#views button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===state.view));
  document.querySelectorAll("#wscope button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.w===state.wscope));
  document.querySelectorAll("#rrange button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.rr===state.rrange));
}
function renderSummary(){
  const all=STOCKS.filter(s=>val(s.t)!=null);
  if(!all.length){$("summary").innerHTML="";return}
  const r=wret(all);
  const up=all.filter(s=>val(s.t)>0).length, dn=all.filter(s=>val(s.t)<0).length;
  const sorted=[...all].sort((a,b)=>val(b.t)-val(a.t));
  const best=sorted[0], worst=sorted[sorted.length-1];
  $("summary").innerHTML=`
   <div class="stat"><div class="lab">指数加重・${PLABEL[state.period]}</div><div class="val ${cls(r)}">${fmt(r,2)}</div><div class="sub">${all.length}銘柄</div></div>
   <div class="stat"><div class="lab">上昇 / 下落</div><div class="val"><span class="pos">${up}</span><span style="color:var(--muted);font-weight:500"> / </span><span class="neg">${dn}</span></div><div class="sub">上昇比率 ${Math.round(up/all.length*100)}%</div></div>
   <div class="stat"><div class="lab">最大上昇</div><div class="val ${cls(val(best.t))}">${fmt(val(best.t))}</div><div class="sub"><b class="num" style="font-size:14px">${best.t}</b> ${esc(best.name)}</div></div>
   <div class="stat"><div class="lab">最大下落</div><div class="val ${cls(val(worst.t))}">${fmt(val(worst.t))}</div><div class="sub"><b class="num" style="font-size:14px">${worst.t}</b> ${esc(worst.name)}</div></div>`;
}
function renderContrib(){
  const rows=STOCKS.map(s=>({t:s.t,c:contrib(s.t)})).filter(r=>r.c!=null);
  const sum=rows.reduce((a,r)=>a+r.c,0);
  $("csum").innerHTML=`合計 <b class="num ${cls(sum)}">${sum>0?"+":sum<0?"−":"±"}${Math.abs(sum).toFixed(2)}pt</b>（＝指数加重・${PLABEL[state.period]}）`;
  const pos=rows.filter(r=>r.c>0).sort((a,b)=>b.c-a.c).slice(0,5);
  const neg=rows.filter(r=>r.c<0).sort((a,b)=>a.c-b.c).slice(0,5);
  const mx=Math.max(...pos.map(r=>r.c),...neg.map(r=>-r.c),1e-9);
  const col=(arr,title,c)=>`<div><h3>${title}</h3>${arr.length?arr.map(r=>`<div class="crow" data-t="${r.t}" role="button" tabindex="0"><span class="tk">${r.t}</span><span class="track"><span class="fill" style="width:${Math.max(2,Math.abs(r.c)/mx*100)}%;background:${c}"></span></span><span class="v num">${r.c>0?"+":"−"}${Math.abs(r.c).toFixed(2)}</span></div>`).join(""):`<div style="font-size:12px;color:var(--muted)">該当なし</div>`}</div>`;
  $("contrib").innerHTML=col(pos,"押し上げ",C.up)+col(neg,"押し下げ",C.down);
}
function renderSectors(){
  const secs=SECTORS.map(sec=>{const list=STOCKS.filter(s=>s.sec===sec);return{sec,w:list.reduce((a,s)=>a+s.w,0)/100,r:wret(list)}}).sort((a,b)=>(b.r??-1e9)-(a.r??-1e9));
  const mx=Math.max(...secs.map(s=>Math.abs(s.r||0)),1e-9);
  $("sectors").innerHTML=secs.map(s=>{
    const pct=Math.abs(s.r||0)/mx*50;
    const bar=s.r>=0?`left:50%;width:${pct}%;background:${C.up};border-radius:0 3px 3px 0`:`right:50%;width:${pct}%;background:${C.down};border-radius:3px 0 0 3px`;
    return `<button type="button" class="secrow" data-sec="${esc(s.sec)}" aria-pressed="${state.zoom===s.sec}"><span class="nm">${secJa(s.sec)}</span><span class="wt num">${(s.w*100).toFixed(1)}%</span><span class="dbar"><i style="${bar}"></i></span><span class="v num ${cls(s.r)}">${fmt(s.r,2)}</span></button>`}).join("");
}
function renderLegend(){
  const m=CLAMP[state.period];
  $("lgL").textContent="−"+m+"%";$("lgR").textContent="+"+m+"%";
  $("ramp").style.background=`linear-gradient(90deg,${[-1,-.5,0,.5,1].map(x=>color(x*m)).join(",")})`;
}
function renderMap(){
  const el=$("map");
  const W=el.clientWidth; if(!W)return;
  const narrow=W<640;
  const H=state.zoom?(narrow?Math.round(W*1.15):Math.round(Math.min(W*.5,620))):(narrow?Math.round(W*1.55):Math.round(Math.min(W*.6,760)));
  el.style.height=H+"px";
  const secs=SECTORS.filter(sec=>!state.zoom||sec===state.zoom).map(sec=>{
    const inds={};STOCKS.filter(s=>s.sec===sec).forEach(s=>{(inds[s.ind]=inds[s.ind]||[]).push({t:s.t,cap:s.w})});
    return{name:sec,children:Object.entries(inds).map(([ind,ch])=>({name:ind,children:ch}))};
  });
  // very small sectors (energy, financials, ...) get a minimum share of the area,
  // so their stocks are big enough to see and tap under the sector heading
  if(!state.zoom){
    const tot=d3.sum(STOCKS,s=>s.w), floor=tot*(narrow?.045:.02);
    secs.forEach(sec=>{const v=d3.sum(sec.children,i=>d3.sum(i.children,c=>c.cap));
      if(v>0&&v<floor)sec.children.forEach(i=>i.children.forEach(c=>{c.cap*=floor/v}))});
  }
  const root=d3.hierarchy({name:"root",children:secs}).sum(d=>d.cap||0).sort((a,b)=>b.value-a.value);
  d3.treemap().size([W,H]).tile(d3.treemapSquarify.ratio(1.15))
    .paddingOuter(d=>d.depth===1?2:0).paddingTop(d=>d.depth===1?20:0).paddingInner(d=>d.depth===0?3:1).round(true)(root);
  let html="";
  (root.children||[]).forEach(s=>{
    const r=wret(STOCKS.filter(x=>x.sec===s.data.name));
    html+=`<div class="sec" style="left:${s.x0}px;top:${s.y0}px;width:${s.x1-s.x0}px;height:${s.y1-s.y0}px"><div class="sh"><span>${secJa(s.data.name)}</span><b class="${cls(r)}">${fmt(r,2)}</b></div></div>`;
  });
  root.leaves().forEach(l=>{
    const t=l.data.t, w=l.x1-l.x0, h=l.y1-l.y0; if(!t||w<1||h<1)return;
    const v=val(t), bg=color(v), ink=inkOn(bg);
    // ticker size from the tile's area, narrowed to fit its width
    const fs=Math.max(9,Math.min(32,Math.sqrt(w*h)/4.1,(w-4)/(.6*t.length)));
    const showT=w>=fs*.6*t.length+4&&h>=fs+3;
    const pfs=Math.max(9,fs*.62);
    const ptxt=fmt(v);
    const showP=showT&&h>=fs+pfs+6&&w>=pfs*.56*ptxt.length+4;
    html+=`<button type="button" class="tile${state.sel===t?" sel":""}" data-t="${t}" style="left:${l.x0}px;top:${l.y0}px;width:${w}px;height:${h}px;background:${bg};color:${ink}" aria-label="${t} ${ptxt}">${showT?`<span class="t" style="font-size:${fs}px">${t}</span>`:""}${showP?`<span class="p" style="font-size:${pfs}px">${ptxt}</span>`:""}</button>`;
  });
  el.innerHTML=html;
}
function renderList(){
  const list=STOCKS.filter(s=>!state.zoom||s.sec===state.zoom).sort((a,b)=>(val(b.t)??-1e9)-(val(a.t)??-1e9));
  const mx=Math.max(...list.map(s=>Math.abs(val(s.t)||0)),1e-9);
  $("list").innerHTML=list.map((s,i)=>{
    const v=val(s.t);const pct=Math.abs(v||0)/mx*50;
    const bar=v==null?"":v>=0?`left:50%;width:${pct}%;background:${C.up};border-radius:0 3px 3px 0`:`right:50%;width:${pct}%;background:${C.down};border-radius:3px 0 0 3px`;
    return `<button type="button" class="row" data-t="${s.t}"><span class="rk num">${i+1}</span><span class="tk">${s.t}</span><span class="nm"><div>${esc(s.name)}</div><small>${secJa(s.sec)} · ${fmtCap(s.cap)}</small></span><span class="dbar bc"><i style="${bar}"></i></span><span class="v num ${cls(v)}">${fmt(v)}</span></button>`}).join("");
}
function renderWeights(){
  const all=[...STOCKS].sort((a,b)=>b.w-a.w);
  const w=s=>s.w;
  const top10=all.slice(0,10).reduce((a,s)=>a+w(s),0), top20=all.slice(0,20).reduce((a,s)=>a+w(s),0);
  $("wstats").innerHTML=`<div>上位10社<b>${top10.toFixed(2)}%</b></div><div>上位20社<b>${top20.toFixed(2)}%</b></div><div>残り${all.length-20}社<b>${(100-top20).toFixed(2)}%</b></div>`;
  let list=all.map((s,i)=>({s,rank:i+1}));

  let html="";
  list.forEach((x,i)=>{

    const v=val(x.s.t);
    html+=`<button type="button" class="wrow" data-t="${x.s.t}"><span class="rk num">${x.rank}</span><span class="tk">${x.s.t}<small>${esc(x.s.name)}</small></span><span class="wbar"><i style="width:${Math.max(1,w(x.s)/mx*100)}%;background:${color(v)}"></i></span><span class="w num">${w(x.s).toFixed(2)}%</span><span class="v num ${cls(v)}">${fmt(v)}</span></button>`;
  });
  $("wlist").innerHTML=html;

/* rank history */
const nyMonth=iso=>new Intl.DateTimeFormat("en-CA",{timeZone:"America/New_York",year:"numeric",month:"2-digit"}).format(new Date(iso)).slice(0,7);
const nextMonth=k=>{let[y,m]=k.split("-").map(Number);m++;if(m>12){m=1;y++}return`${y}-${String(m).padStart(2,"0")}`};
const jaMonth=k=>{const[y,m]=k.split("-");return`${y}年${+m}月`};
// History months plus the current month, whose ranks come from the latest market caps.
function rankSeries(){
  if(!RH||!RH.months||!DATA)return null;
  const months=[...RH.months];const cur=nyMonth(DATA.updatedAt);
  while(months.length&&months[months.length-1]<cur&&months.length<RH.months.length+3)months.push(nextMonth(months[months.length-1]));
  const ci=months.indexOf(cur);
  const live={};[...STOCKS].sort((a,b)=>b.cap-a.cap).forEach((s,i)=>live[s.t]=i+1);
  const top=Object.keys(live).filter(t=>live[t]<=20).sort((a,b)=>live[a]-live[b]);
  const ser={};
  top.forEach(t=>{const h=(RH.ranks&&RH.ranks[t])||[];const a=months.map((_,i)=>typeof h[i]==="number"?h[i]:null);if(ci>=0)a[ci]=live[t];ser[t]=a});
  // ranks of every stock by month, for the month list
  return{months,top,ser,cur:ci>=0?ci:months.length-1};
}
function renderRanks(){
  const box=$("rchart");const R=rankSeries();
  if(!R){box.innerHTML=`<div class="empty" style="padding:40px 10px">順位の履歴を読み込んでいます…</div>`;$("rinfo").innerHTML="";$("rkey").innerHTML="";return}
  const n=Math.min(R.months.length,+state.rrange*12+1), i0=R.months.length-n;
  const W=Math.max(300,box.clientWidth-8), narrow=W<560;
  const ML=24,MR=50,MT=8,MB=22, H=narrow?Math.round(Math.min(640,W*1.6)):560;
  const PW=W-ML-MR, PH=H-MT-MB, MAXR=40;
  const x=i=>ML+(i-i0)/(n-1)*PW, y=r=>MT+(r-1)/(MAXR-1)*PH;
  // colour by change over the shown period: up = climbed 3+ places, down = fell 3+ places
  const first=a=>{for(let i=i0;i<a.length;i++)if(a[i]!=null)return a[i];return null};
  const lineCol={};
  R.top.forEach(t=>{const a=R.ser[t],f=first(a),l=a[R.cur];const d=f==null||l==null?0:f-l;lineCol[t]=d>=3?C.up:d<=-3?C.down:C.flat});
  let g="";
  [1,5,10,15,20,25,30,35,40].forEach(r=>{g+=`<line class="grid" x1="${ML}" x2="${ML+PW}" y1="${y(r)}" y2="${y(r)}"/><text class="ax" x="${ML-6}" y="${y(r)+4}" text-anchor="end">${r}</text>`});
  const step=n>80?(narrow?2:1):1;
  R.months.forEach((k,i)=>{if(i<i0||!k.endsWith("-01"))return;const yy=+k.slice(0,4);if(step===2&&yy%2)return;g+=`<line class="grid" x1="${x(i)}" x2="${x(i)}" y1="${MT+PH}" y2="${MT+PH+4}"/><text class="ax" x="${x(i)}" y="${H-5}" text-anchor="middle">${n>40?"’"+String(yy).slice(2):yy}</text>`});
  const path=a=>{let d="",pen=false;for(let i=i0;i<a.length;i++){const r=a[i];if(r==null){pen=false;continue}d+=(pen?"L":"M")+x(i).toFixed(1)+" "+y(Math.min(r,MAXR+4)).toFixed(1);pen=true}return d};
  const order=[...R.top].reverse();
  let lines="";order.forEach(t=>{if(t===state.rsel)return;lines+=`<path class="ln" d="${path(R.ser[t])}" stroke="${lineCol[t]}" data-rk="${t}"/>`});
  if(state.rsel&&R.ser[state.rsel])lines+=`<path class="ln on" d="${path(R.ser[state.rsel])}" data-rk="${state.rsel}"/>`;
  let labels="";R.top.forEach(t=>{const r=R.ser[t][R.cur];labels+=`<text class="lb${t===state.rsel?" on":""}" x="${ML+PW+6}" y="${y(r)+4}" data-rk="${t}">${t}</text>`});
  const mi=state.rmonth!=null&&state.rmonth>=i0&&state.rmonth<R.months.length?state.rmonth:R.cur;
  let xh="";if(mi!==R.cur){xh=`<line class="xh" x1="${x(mi)}" x2="${x(mi)}" y1="${MT}" y2="${MT+PH}"/>`}
  if(state.rsel&&R.ser[state.rsel]){const r=R.ser[state.rsel][mi];if(r!=null&&r<=MAXR)xh+=`<circle class="dot" cx="${x(mi)}" cy="${y(r)}" r="4.5"/>`}
  box.classList.toggle("has-sel",!!state.rsel);
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="時価総額上位20社の順位推移"><defs><clipPath id="rclip"><rect x="0" y="0" width="${W}" height="${y(MAXR+.5)}"/></clipPath></defs>${g}<g clip-path="url(#rclip)">${lines}</g>${labels}${xh}<rect id="rhit" x="${ML}" y="${MT}" width="${PW}" height="${PH}" fill="transparent"/></svg>`;
  box._geo={i0,n,ML,PW};
  $("rkey").innerHTML=`<span><i style="background:${C.up}"></i>上昇</span><span><i style="background:${C.down}"></i>下落</span><span><i style="background:${C.flat}"></i>横ばい</span><span>${state.rrange}年前（上場時）と比べて3位以上の変化</span>`;
  renderRankInfo(R,mi,i0);
}
function renderRankInfo(R,mi,i0){
  const k=R.months[mi];
  const rows=R.top.map(t=>({t,r:R.ser[t][mi]})).sort((a,b)=>(a.r??999)-(b.r??999));
  let sel="";
  if(state.rsel&&R.ser[state.rsel]){const a=R.ser[state.rsel];let f=null,fi=null;for(let i=i0;i<a.length;i++)if(a[i]!=null){f=a[i];fi=i;break}
    sel=`<p class="rsel"><b>${state.rsel}</b>　${jaMonth(R.months[fi])} ${f}位 → 現在 ${a[R.cur]}位${a[mi]!=null&&mi!==R.cur?`（${jaMonth(k)}は${a[mi]}位）`:""}</p>`}
  $("rinfo").innerHTML=`${sel}<h3>${jaMonth(k)}の順位<span>${mi===R.cur?"最新":"月末"}</span></h3><div class="rgrid">${rows.map(x=>{const now=R.ser[x.t][R.cur];const d=x.r==null?null:x.r-now;
    return `<button type="button" class="rchip" data-rk="${x.t}" aria-pressed="${x.t===state.rsel}"><span class="r">${x.r==null?"—":x.r}</span><span class="t">${x.t}</span>${mi!==R.cur&&d?`<span class="d ${d>0?"pos":"neg"}">${d>0?"↑":"↓"}${Math.abs(d)}</span>`:""}</button>`}).join("")}</div>${mi!==R.cur?`<p class="wnote">↑↓は、その月から現在までの順位の変化です。</p>`:""}`;
}
function rankMonthAt(clientX){
  const box=$("rchart"),g=box._geo,svg=box.querySelector("svg");if(!g||!svg)return null;
  const r=svg.getBoundingClientRect();const sx=(clientX-r.left)*(svg.viewBox.baseVal.width/r.width);
  const f=(sx-g.ML)/g.PW;return Math.max(g.i0,Math.min(g.i0+g.n-1,Math.round(g.i0+f*(g.n-1))));
}

function renderDetail(){
  const d=$("detail");
  if(!state.sel||!BY[state.sel]){d.hidden=true;return}
  const s=BY[state.sel];
  const chips=PERIODS.map(([k,l])=>{const v=val(s.t,k);const bg=colorAt(v,k);return `<div class="pc${k===state.period?" cur":""}" style="background:${bg};color:${inkOn(bg)}"><div class="l">${l}</div><div class="n">${fmt(v,v!=null&&Math.abs(v)>=100?0:1)}</div></div>`}).join("");
  const cv=contrib(s.t), sw=startW()[s.t];
  d.innerHTML=`<div class="dhead"><div><div class="dtk">${s.t}</div><div class="dname">${esc(s.name)}</div><div class="dmeta">${secJa(s.sec)} · ${esc(s.ind)}</div></div><button type="button" class="x" id="close">閉じる</button></div>
   <div class="dfacts"><span>時価総額<b>${fmtCap(s.cap)}</b></span><span>指数ウェイト<b>${s.w.toFixed(2)}%</b></span><span>寄与（${PLABEL[state.period]}）<b>${cv==null?"—":(cv>0?"+":"−")+Math.abs(cv).toFixed(2)+"pt"}</b><small>期初ウェイト ${sw==null?"—":sw.toFixed(2)+"%"} × ${fmt(val(s.t))}</small></span></div>
   <div class="pgrid">${chips}</div>
   <a class="dlink" href="https://finviz.com/quote.ashx?t=${encodeURIComponent(s.t)}" target="_blank" rel="noopener noreferrer">finvizで${s.t}を開く ↗</a>`;
  d.hidden=false;
  $("close").onclick=()=>{state.sel=null;renderMapOrList();renderDetail()};
}
function renderMapOrList(){
  const v=state.view;
  $("map").hidden=v!=="map";$("list").hidden=v!=="list";$("weights").hidden=v!=="weight";$("ranks").hidden=v!=="rank";
  $("back").hidden=!state.zoom;
  document.querySelector(".legend").style.visibility=v==="map"?"visible":"hidden";
  $("hint").textContent=state.zoom?`${secJa(state.zoom)}を表示中`:({map:"面積＝指数ウェイト、色＝騰落率。タップで詳細",list:`${PLABEL[state.period]}の騰落率順。タップで詳細`,weight:`指数ウェイト：${weightNote()}。タップで詳細`,rank:"チャートをタップ、または横になぞると、その月の順位が出ます。銘柄をタップで強調"})[v];
  if(state.zoom&&v==="rank")$("hint").textContent="順位推移はセクターで絞り込みません";
  if(v==="map")renderMap();else if(v==="list")renderList();else if(v==="weight")renderWeights();else renderRanks();
}
function renderAll(){
  readColors();renderControls();
  if(!DATA)return;
  $("app").hidden=false;$("empty").hidden=true;
  renderStatus();renderSummary();renderContrib();renderSectors();renderLegend();renderMapOrList();renderDetail();
}

/* data loading */
let loading=false;
async function loadRanks(){
  try{const r=await fetch("data/rank_history.json",{cache:"no-cache"});if(r.ok){const j=await r.json();if(j&&j.months&&j.ranks)RH=j}}catch(e){}
}
async function load(manual){
  if(loading)return;loading=true;
  const btn=$("refresh");btn.classList.add("spin");
  try{
    const r=await fetch("data/ndx.json?ts="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const d=await r.json();
    if(!d||!Array.isArray(d.stocks)||!d.perf)throw new Error("bad data");
    if(!RH||manual)await loadRanks();
    if(!DATA||d.updatedAt!==DATA.updatedAt||manual){setData(d);renderAll()}
    else renderStatus();
  }catch(e){
    if(!DATA){$("empty").textContent="データを読み込めませんでした。通信状況を確認して、右上の↻で再読み込みしてください。";$("status").textContent="読み込みに失敗しました"}
    else renderStatus();
  }finally{loading=false;btn.classList.remove("spin")}
}

/* events */
document.addEventListener("click",e=>{
  const p=e.target.closest("[data-p]");if(p){state.period=p.dataset.p;store.set("period",state.period);renderAll();return}
  const v=e.target.closest("[data-v]");if(v){state.view=v.dataset.v;store.set("view",state.view);renderAll();return}
  const rr=e.target.closest("[data-rr]");if(rr){state.rrange=rr.dataset.rr;store.set("rrange",state.rrange);state.rmonth=null;renderControls();renderRanks();return}
  const rk=e.target.closest("[data-rk]");if(rk){state.rsel=state.rsel===rk.dataset.rk?null:rk.dataset.rk;renderRanks();return}
  const ws=e.target.closest("[data-w]");if(ws){state.wscope=ws.dataset.w;store.set("wscope",state.wscope);renderControls();renderWeights();return}
  const se=e.target.closest("[data-sec]");if(se){state.zoom=state.zoom===se.dataset.sec?null:se.dataset.sec;renderSectors();renderMapOrList();$("map").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});return}
  if(e.target.closest("#back")){state.zoom=null;renderSectors();renderMapOrList();return}
  if(e.target.closest("#refresh")){load(true);return}
  const t=e.target.closest("[data-t]");if(t){const tk=t.dataset.t;state.sel=state.sel===tk?null:tk;$("tip").hidden=true;renderMapOrList();renderDetail();return}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&state.sel){state.sel=null;renderMapOrList();renderDetail()}
  if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("crow")){e.preventDefault();e.target.click()}
});
const tip=$("tip");
$("map").addEventListener("pointermove",e=>{
  if(e.pointerType!=="mouse"){tip.hidden=true;return}
  const t=e.target.closest(".tile");if(!t){tip.hidden=true;return}
  const s=BY[t.dataset.t];if(!s)return;const v=val(s.t);
  tip.innerHTML=`<b>${s.t}</b> <span class="num ${cls(v)}" style="font-size:16px;font-weight:700">${fmt(v)}</span><div>${esc(s.name)}</div><div style="color:var(--muted)">${esc(s.ind)} · ${fmtCap(s.cap)}</div>`;
  tip.hidden=false;
  const r=tip.getBoundingClientRect();let x=e.clientX+14,y=e.clientY+14;
  if(x+r.width>innerWidth-8)x=e.clientX-r.width-14;if(y+r.height>innerHeight-8)y=e.clientY-r.height-14;
  tip.style.left=x+"px";tip.style.top=y+"px";
});
$("map").addEventListener("pointerleave",()=>{tip.hidden=true});

let rt;new ResizeObserver(()=>{clearTimeout(rt);rt=setTimeout(()=>{if(DATA&&state.view==="map")renderMap();if(DATA&&state.view==="rank")renderRanks()},80)}).observe($("map").parentElement);
// rank chart: a tap (or click) picks the month, sliding a finger sideways moves it,
// a vertical swipe scrolls the page and keeps it; a tap outside the chart clears it
{const rc=$("rchart");let t=null;
 const at=e=>{const m=rankMonthAt(e.clientX);if(m!=null&&m!==state.rmonth){state.rmonth=m;renderRanks()}};
 rc.addEventListener("pointerdown",e=>{if(e.target.closest("#rhit"))t={x:e.clientX,y:e.clientY,id:e.pointerId,slide:false}});
 rc.addEventListener("pointermove",e=>{
   if(e.pointerType==="mouse"&&!t){if(e.target.closest("#rhit"))at(e);return}
   if(!t||e.pointerId!==t.id)return;
   const dx=e.clientX-t.x,dy=e.clientY-t.y;
   if(!t.slide&&Math.abs(dx)>6&&Math.abs(dx)>Math.abs(dy))t.slide=true;
   if(t.slide)at(e);
 });
 rc.addEventListener("pointerup",e=>{if(t&&e.pointerId===t.id&&(t.slide||Math.hypot(e.clientX-t.x,e.clientY-t.y)<10))at(e);t=null});
 rc.addEventListener("pointercancel",()=>{t=null});
 let out=null;
 document.addEventListener("pointerdown",e=>{out=e.target.closest("#rchart,button,a,[data-rk],[data-t]")?null:{x:e.clientX,y:e.clientY,id:e.pointerId}},true);
 document.addEventListener("pointercancel",()=>{out=null},true);
 document.addEventListener("pointerup",e=>{const o=out;out=null;
   if(!o||e.pointerId!==o.id||Math.hypot(e.clientX-o.x,e.clientY-o.y)>=10||state.rmonth==null)return;
   state.rmonth=null;if(DATA&&state.view==="rank")renderRanks()},true);}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")load(false)});
setInterval(()=>{if(document.visibilityState==="visible")load(false)},5*60*1000);
setInterval(()=>{if(DATA)renderStatus()},60*1000);

renderAll();
load(false);
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
